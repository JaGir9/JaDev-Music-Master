name: Build Windows Portable App

on:
  push:
    branches: [main]
    paths-ignore:
      - "JaDevMusicMaster-Windows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg essentials
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath vendor
          $dir = Get-ChildItem vendor -Directory | Where-Object { $_.Name -ne "ffmpeg" } | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path vendor\ffmpeg\bin | Out-Null
          Copy-Item "$($dir.FullName)\bin\ffmpeg.exe" vendor\ffmpeg\bin\ffmpeg.exe
          Copy-Item "$($dir.FullName)\bin\ffprobe.exe" vendor\ffmpeg\bin\ffprobe.exe

      - name: Build portable Windows application
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onedir --windowed --name JaDevMusicMaster --paths src --add-binary "vendor/ffmpeg/bin/ffmpeg.exe;vendor/ffmpeg/bin" --add-binary "vendor/ffmpeg/bin/ffprobe.exe;vendor/ffmpeg/bin" src/jadev_music_master/__main__.py
          if (!(Test-Path "dist\JaDevMusicMaster\JaDevMusicMaster.exe")) { throw "EXE was not created" }

      - name: Publish portable build inside repository
        shell: pwsh
        run: |
          if (Test-Path "JaDevMusicMaster-Windows") { Remove-Item "JaDevMusicMaster-Windows" -Recurse -Force }
          Copy-Item "dist\JaDevMusicMaster" "JaDevMusicMaster-Windows" -Recurse
          @"
          JaDev Music Master - Windows Portable

          1. Keep this entire folder together.
          2. Double-click JaDevMusicMaster.exe.
          3. No Python installation is required.

          This is a development preview build.
          "@ | Set-Content "JaDevMusicMaster-Windows\HOW-TO-RUN.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f JaDevMusicMaster-Windows
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update Windows portable build [skip ci]"
            git push
          }

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: JaDevMusicMaster-Windows
          path: JaDevMusicMaster-Windows/
          if-no-files-found: error
          retention-days: 90
